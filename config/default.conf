server {
    listen 8080;
    client_max_body_size 10485760; //10 * 1024 * 1024 -> 10MB (el parser lo trata como bits sin sufijo.)
    error_page 404 ./html/404.html;

    location / {
        root ./html;
        index index.html;
        methods GET;
        autoindex off;
    }

    location /uploads {
        root ./html;
        methods GET POST DELETE;
        upload_store ./html/uploads;
        autoindex on;
    }
}
